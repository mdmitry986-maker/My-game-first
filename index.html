
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CITY LIFE 3D — PC Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87b9d5;font-family:Arial;color:white}
canvas{display:block}
button,select{padding:13px 20px;border:1px solid #ffffff55;border-radius:10px;background:#20374e;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#28618c}
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#071827aa,#071321ee)}
.panel{width:min(430px,90%);padding:35px;background:#142a40ee;border:1px solid #ffffff44;border-radius:22px;text-align:center;box-shadow:0 15px 60px #0009}
h1{font-size:38px;margin:0 0 10px}
.subtitle{color:#b9d1e5;margin-bottom:30px}
.buttons{display:flex;flex-direction:column;gap:12px}
.buttons button{width:100%}
.primary{background:#137dc6}
#settings,#pause{display:none}
#hud{display:none;position:fixed;inset:0;pointer-events:none}
#logo{position:absolute;top:20px;left:22px;font-weight:bold;text-shadow:0 2px 5px black}
#hint{position:absolute;top:48px;left:22px;font-size:12px;color:#e5edf4;text-shadow:0 2px 5px black}
#status{position:absolute;right:22px;top:20px;background:#142a40cc;padding:12px;border-radius:10px}
#pauseBtn{position:absolute;right:20px;top:70px;pointer-events:auto}
#prompt{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);background:#142a40dd;padding:14px 22px;border-radius:12px;display:none;white-space:nowrap}
#crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;background:white;border-radius:50%;box-shadow:0 0 4px black}
.setting{text-align:left;margin:20px 0}
.setting select{width:100%;margin-top:10px}
</style>
</head>
<body>

<div id="menu" class="screen">
 <div class="panel">
  <h1>CITY LIFE 3D</h1>
  <div class="subtitle">PC EDITION — ТВОЯ ЖИЗНЬ. ТВОЙ ГОРОД.</div>
  <div class="buttons">
   <button class="primary" onclick="startGame()">НОВАЯ ИГРА</button>
   <button onclick="showSettings()">НАСТРОЙКИ</button>
  </div>
  <p style="color:#91abc1;font-size:12px;margin-top:25px">OPEN WORLD • 3D • PC</p>
 </div>
</div>

<div id="settings" class="screen">
 <div class="panel">
  <h1>НАСТРОЙКИ</h1>
  <div class="setting">
   Качество графики
   <select id="quality">
    <option value="1">Низкое</option>
    <option value="1.5" selected>Среднее</option>
    <option value="2">Высокое</option>
   </select>
  </div>
  <div class="setting">
   Чувствительность мыши
   <select id="sensitivity">
    <option value=".0015">Низкая</option>
    <option value=".0025" selected>Средняя</option>
    <option value=".004">Высокая</option>
   </select>
  </div>
  <div class="buttons">
   <button class="primary" onclick="saveSettings()">СОХРАНИТЬ</button>
   <button onclick="backMenu()">НАЗАД</button>
  </div>
 </div>
</div>

<div id="pause" class="screen">
 <div class="panel">
  <h1>ПАУЗА</h1>
  <div class="buttons">
   <button class="primary" onclick="resumeGame()">ПРОДОЛЖИТЬ</button>
   <button onclick="goMenu()">В ГЛАВНОЕ МЕНЮ</button>
  </div>
 </div>
</div>

<div id="hud">
 <div id="logo">CITY LIFE 3D</div>
 <div id="hint">WASD — движение | SHIFT — бег | F — машина | ESC — пауза</div>
 <div id="status">ПЕШЕХОД</div>
 <div id="crosshair"></div>
 <button id="pauseBtn" onclick="pauseGame()">Ⅱ</button>
 <div id="prompt">Нажми F, чтобы сесть в машину</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

// =========================
// ОСНОВА ИГРЫ
// =========================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c4e5);
scene.fog=new THREE.Fog(0x91c4e5,90,260);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,500
);

const renderer=new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// СВЕТ
scene.add(new THREE.HemisphereLight(0xffffff,0x647080,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-50,90,40);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);

// МАТЕРИАЛЫ
const material=color=>new THREE.MeshStandardMaterial({
 color,roughness:.85
});

function box(parent,x,y,z,w,h,d,mat){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

// =========================
// ГОРОД
// =========================

// Земля
box(scene,0,-.5,0,400,1,400,material(0x547b48));

// Дороги
const asphalt=material(0x30363b);
const sidewalk=material(0xa9a9a3);
const white=material(0xffffff);

for(let i=-180;i<=180;i+=60){
 box(scene,i,.02,0,17,.12,400,asphalt);
 box(scene,0,.02,i,400,.12,17,asphalt);

 // Тротуары
 box(scene,i+10,.1,0,3,.2,400,sidewalk);
 box(scene,i-10,.1,0,3,.2,400,sidewalk);
 box(scene,0,.1,i+10,400,.2,3,sidewalk);
 box(scene,0,.1,i-10,400,.2,3,sidewalk);

 // Разметка
 for(let j=-180;j<=180;j+=12){
  box(scene,i,.1,j, .18,.025,4,white);
  box(scene,j,.1,i,4,.025,.18,white);
 }
}

// Здания
const colors=[
 0xd1c0aa,0x8d9da9,0xb7b7a8,
 0x777e88,0xd5c8b6,0x9eaaa0
];

const buildings=[];

for(let x=-170;x<=170;x+=30){
 for(let z=-170;z<=170;z+=30){

  if(Math.abs(x%60)<14||Math.abs(z%60)<14)continue;

  const w=15+Math.random()*8;
  const d=15+Math.random()*8;
  const h=12+Math.random()*30;

  const b=box(
   scene,x,h/2,z,w,h,d,
   material(colors[Math.floor(Math.random()*colors.length)])
  );

  buildings.push({x,z,w,d});

  // Окна
  const glass=material(0x73b8d2);

  for(let y=3;y<h-2;y+=4){
   for(let a=-w/2+2;a<w/2-1;a+=3){
    box(scene,x+a,y,z+d/2+.06,1.5,2,.1,glass);
    box(scene,x+a,y,z-d/2-.06,1.5,2,.1,glass);
   }
  }
 }
}

// ДЕРЕВЬЯ
const trunkMat=material(0x65402a);
const leafMat=material(0x347a3c);

function tree(x,z){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);

 box(group,0,1,0,.5,2,.5,trunkMat);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(1.5,10,8),leafMat
 );
 leaves.position.y=3;
 leaves.castShadow=true;
 group.add(leaves);
}

for(let i=-160;i<=160;i+=30){
 for(let z=-160;z<=160;z+=30){
  if(Math.abs(i%60)<12||Math.abs(z%60)<12)continue;
  tree(i+12,z+12);
 }
}

// =========================
// ПЕРСОНАЖ
// =========================

const player=new THREE.Group();
scene.add(player);

const clothes=material(0x263c72);
const skin=material(0xc99370);
const trousers=material(0x20232b);
const shoes=material(0x151515);

box(player,0,1.45,0,.7,1,.4,clothes);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.28,16,12),skin
);
head.position.y=2.15;
player.add(head);

const legs=[];
const arms=[];

for(const x of [-.2,.2]){
 legs.push(box(player,x,.65,0,.25,.9,.3,trousers));
}

for(const x of [-.5,.5]){
 arms.push(box(player,x,1.45,0,.2,.8,.22,clothes));
}

for(const x of [-.2,.2]){
 box(player,x,.16,.04,.28,.2,.4,shoes);
}

player.position.set(0,0,5);

// =========================
// АВТОМОБИЛЬ
// =========================

const car=new THREE.Group();
scene.add(car);

const carPaint=material(0x165caa);
const glass=material(0x80b5c8);
const rubber=material(0x161616);

box(car,0,.75,0,2.4,.8,4,carPaint);
box(car,0,1.4,-.25,1.8,.8,2,glass);

const wheels=[];

for(const x of [-1.1,1.1]){
 for(const z of [-1.3,1.3]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.43,.43,.3,20),
   rubber
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.4,z);
  car.add(wheel);
  wheels.push(wheel);
 }
}

car.position.set(5,0,0);

// Фары
for(const x of [-.8,.8]){
 const lamp=box(car,x,.8,-2.02,.35,.25,.08,material(0xffffaa));
}

// =========================
// ЖИТЕЛИ ГОРОДА
// =========================

const npcs=[];

for(let i=0;i<14;i++){
 const npc=new THREE.Group();

 box(
  npc,0,1,0,.5,.9,.35,
  material([0xc64b40,0x4775a5,0xd1a44b,0x418052][i%4])
 );

 const face=new THREE.Mesh(
  new THREE.SphereGeometry(.22,12,10),skin
 );
 face.position.y=1.65;
 npc.add(face);

 npc.position.set(
  i%2?13:-13,
  0,
  -70+i*10
 );

 scene.add(npc);

 npcs.push({
  obj:npc,
  dir:i%2?1:-1
 });
}

// =========================
// УПРАВЛЕНИЕ
// =========================

const keys={};

let paused=true;
let started=false;
let inCar=false;
let running=false;
let speed=0;
let angle=0;

let yaw=0;
let pitch=.2;
let sensitivity=.0025;

let velocityY=0;
let onGround=true;

let carSpeed=0;

let quality=1.5;

const clock=new THREE.Clock();

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;

 if(e.key===' '||e.key.startsWith('Arrow')){
  e.preventDefault();
 }

 if(e.key==='Escape'&&started){
  if(paused)resumeGame();
  else pauseGame();
 }

 if(e.key.toLowerCase()==='f'&&!e.repeat){
  if(inCar)exitCar();
  else if(!paused&&player.position.distanceTo(car.position)<5){
   enterCar();
  }
 }

 if(e.key===' '&&!e.repeat&&!inCar){
  if(onGround&&!paused){
   velocityY=7;
   onGround=false;
  }
 }
});

addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

renderer.domElement.addEventListener('click',()=>{
 if(started&&!paused){
  renderer.domElement.requestPointerLock?.();
 }
});

document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement!==renderer.domElement||paused)return;

 yaw-=e.movementX*sensitivity;
 pitch-=e.movementY*sensitivity;

 pitch=THREE.MathUtils.clamp(pitch,-.1,.75);
});

// =========================
// МАШИНА
// =========================

function enterCar(){
 inCar=true;
 player.visible=false;
 car.position.set(player.position.x,0,player.position.z);
 car.rotation.y=angle;
 carSpeed=0;
 document.getElementById('status').textContent='ВОДИТЕЛЬ';
}

function exitCar(){
 inCar=false;
 player.visible=true;

 player.position.copy(car.position);

 player.position.x+=Math.cos(car.rotation.y)*2.5;
 player.position.z-=Math.sin(car.rotation.y)*2.5;

 angle=car.rotation.y;

 document.getElementById('status').textContent='ПЕШЕХОД';
}

// =========================
// КАМЕРА
// =========================

function updateCamera(dt){

 const target=inCar?car.position:player.position;

 const rotation=inCar?car.rotation.y:yaw;

 const distance=inCar?11:7;

 const desired=new THREE.Vector3(
  target.x-Math.sin(rotation)*distance*Math.cos(pitch),
  target.y+2.5+Math.sin(pitch)*distance,
  target.z+Math.cos(rotation)*distance*Math.cos(pitch)
 );

 camera.position.lerp(
  desired,1-Math.exp(-7*dt)
 );

 camera.lookAt(
  target.x,target.y+(inCar?1.2:1.4),target.z
 );
}

// =========================
// ОБНОВЛЕНИЕ ИГРЫ
// =========================

function update(dt){

 if(inCar){

  const throttle=
   (keys.w?1:0)-(keys.s?1:0);

  const steer=
   (keys.d?1:0)-(keys.a?1:0);

  carSpeed+=throttle*13*dt;
  carSpeed*=Math.pow(.985,dt*60);
  carSpeed=THREE.MathUtils.clamp(carSpeed,-10,24);

  car.rotation.y-=steer*carSpeed*.035*dt;

  car.position.x-=Math.sin(car.rotation.y)*carSpeed*dt;
  car.position.z-=Math.cos(car.rotation.y)*carSpeed*dt;

  for(const wheel of wheels){
   wheel.rotation.x+=carSpeed*dt*2;
  }

  car.position.x=THREE.MathUtils.clamp(car.position.x,-190,190);
  car.position.z=THREE.MathUtils.clamp(car.position.z,-190,190);

 }else{

  const forward=
   (keys.w?1:0)-(keys.s?1:0);

  const sideways=
   (keys.d?1:0)-(keys.a?1:0);

  const moving=Math.hypot(forward,sideways);

  running=keys.shift;

  const velocity=running?10:5;

  if(moving>.1){

   const direction=new THREE.Vector3(
    -Math.sin(yaw)*forward+Math.cos(yaw)*sideways,
    0,
    -Math.cos(yaw)*forward-Math.sin(yaw)*sideways
   ).normalize();

   player.position.addScaledVector(
    direction,velocity*dt
   );

   angle=Math.atan2(-direction.x,-direction.z);
   player.rotation.y=angle;

   const animation=Math.sin(clock.elapsedTime*11)*.65;

   legs[0].rotation.x=animation;
   legs[1].rotation.x=-animation;

   arms[0].rotation.x=-animation*.5;
   arms[1].rotation.x=animation*.5;

  }else{
   legs.forEach(l=>l.rotation.x=0);
   arms.forEach(a=>a.rotation.x=0);
  }

  velocityY-=18*dt;
  player.position.y+=velocityY*dt;

  if(player.position.y<=0){
   player.position.y=0;
   velocityY=0;
   onGround=true;
  }

  player.position.x=THREE.MathUtils.clamp(player.position.x,-190,190);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-190,190);
 }

 // ЖИТЕЛИ
 for(const n of npcs){
  n.obj.position.z+=n.dir*dt*1.3;

  if(n.obj.position.z>80)n.dir=-1;
  if(n.obj.position.z<-80)n.dir=1;
 }
 
 // ПОДСКАЗКА МАШИНЫ
 const distance=player.position.distanceTo(car.position);

 document.getElementById('prompt').style.display=
  !inCar&&distance<5?'block':'none';
}

// =========================
// ГЛАВНЫЙ ЦИКЛ
// =========================

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(!paused){
  update(dt);
 }

 updateCamera(dt);

 renderer.render(scene,camera);
}

animate();

// =========================
// ИНТЕРФЕЙС
// =========================

window.startGame=()=>{
 started=true;
 paused=false;

 document.getElementById('menu').style.display='none';
 document.getElementById('settings').style.display='none';
 document.getElementById('pause').style.display='none';
 document.getElementById('hud').style.display='block';

 clock.getDelta();
};

window.pauseGame=()=>{
 if(!started)return;

 paused=true;

 document.getElementById('pause').style.display='flex';

 if(document.pointerLockElement){
  document.exitPointerLock();
 }
};

window.resumeGame=()=>{
 paused=false;

 document.getElementById('pause').style.display='none';
 clock.getDelta();
};

window.goMenu=()=>{
 paused=true;
 started=false;

 document.getElementById('hud').style.display='none';
 document.getElementById('pause').style.display='none';
 document.getElementById('menu').style.display='flex';

 if(document.pointerLockElement){
  document.exitPointerLock();
 }
};

window.showSettings=()=>{
 document.getElementById('menu').style.display='none';
 document.getElementById('settings').style.display='flex';
};

window.backMenu=()=>{
 document.getElementById('settings').style.display='none';
 document.getElementById('menu').style.display='flex';
};

window.saveSettings=()=>{
 quality=Number(document.getElementById('quality').value);
 sensitivity=Number(document.getElementById('sensitivity').value);

 renderer.setPixelRatio(Math.min(devicePixelRatio,quality));

 document.getElementById('settings').style.display='none';
 document.getElementById('menu').style.display='flex';
};

// РАЗМЕР ОКНА
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
